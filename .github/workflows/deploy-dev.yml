name: Deploy to DEV

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy-dev:
    name: Deploy artifact to DEV
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find CI artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ARTIFACT_NAME="MyProject-${HEAD_SHA}"

          echo "Looking for artifact: $ARTIFACT_NAME"
          echo "Workflow run: $RUN_ID"

          ARTIFACT_URL="https://api.github.com/repos/msourabh09/MyProject/actions/runs/${RUN_ID}/artifacts"

          ARTIFACT_ID=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$ARTIFACT_URL" |
            jq -r --arg NAME "$ARTIFACT_NAME" \
            '.artifacts[] | select(.name == $NAME) | .id' |
            head -n 1)

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: Artifact not found."
            exit 1
          fi

          echo "Artifact ID: $ARTIFACT_ID"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Get temporary artifact download URL
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          DOWNLOAD_ENDPOINT="https://api.github.com/repos/msourabh09/MyProject/actions/artifacts/${ARTIFACT_ID}/zip"

          echo "Requesting temporary artifact URL..."

          curl -sS \
            -D headers.txt \
            -o /dev/null \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$DOWNLOAD_ENDPOINT"

          ARTIFACT_URL=$(grep -i '^location:' headers.txt | sed 's/location: //I' | tr -d '\r')

          if [ -z "$ARTIFACT_URL" ]; then
            echo "ERROR: GitHub did not return a download URL."
            cat headers.txt
            exit 1
          fi

          echo "Temporary artifact URL obtained."

          {
            echo 'artifact_url<<EOF'
            echo "$ARTIFACT_URL"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Deploy artifact to Azure VM
        env:
          ARTIFACT_URL: ${{ steps.download.outputs.artifact_url }}
        run: |
          echo "Starting deployment to vm-gtl-dev..."

          az vm run-command invoke \
            --resource-group "RG_Sourabh_Majali" \
            --name "vm-gtl-dev" \
            --command-id RunPowerShellScript \
            --parameters "artifactUrl=$ARTIFACT_URL" \
            --scripts '
              param(
                [string]$artifactUrl
              )

              $ErrorActionPreference = "Stop"

              $siteName = "MyProject"
              $sitePath = "C:\inetpub\wwwroot\MyProject"
              $zipPath = "C:\Windows\Temp\MyProject.zip"

              Write-Host "Starting deployment..."
              Write-Host "Downloading artifact..."

              Invoke-WebRequest `
                -Uri $artifactUrl `
                -OutFile $zipPath `
                -UseBasicParsing

              if (-not (Test-Path $zipPath)) {
                throw "Artifact download failed."
              }

              Write-Host "Artifact downloaded."

              Write-Host "Stopping IIS site..."
              Import-Module WebAdministration

              Stop-Website -Name $siteName -ErrorAction SilentlyContinue
              Stop-WebAppPool -Name $siteName -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 2

              Write-Host "Preparing deployment directory..."

              if (Test-Path "$sitePath\app_offline.htm") {
                Remove-Item "$sitePath\app_offline.htm" -Force
              }

              Get-ChildItem -Path $sitePath -Force |
                Remove-Item -Recurse -Force

              Write-Host "Extracting artifact..."

              Expand-Archive `
                -Path $zipPath `
                -DestinationPath $sitePath `
                -Force

              Remove-Item $zipPath -Force

              Write-Host "Starting IIS..."

              Start-WebAppPool -Name $siteName
              Start-Website -Name $siteName

              Write-Host "Deployment completed."

              Write-Host "IIS site status:"
              Get-Website -Name $siteName

              Write-Host "Application files:"
              Get-ChildItem $sitePath -File |
                Select-Object -First 10 Name
            '

      - name: Verify deployment
        run: |
          echo "Verifying deployment through Azure VM Run Command..."

          az vm run-command invoke \
            --resource-group "RG_Sourabh_Majali" \
            --name "vm-gtl-dev" \
            --command-id RunPowerShellScript \
            --scripts '
              $ErrorActionPreference = "Stop"

              $response = Invoke-WebRequest `
                -Uri "http://localhost" `
                -UseBasicParsing

              Write-Host "HTTP Status: $($response.StatusCode)"
              Write-Host "Server: $($response.Headers.Server)"

              if ($response.StatusCode -ne 200) {
                throw "Application returned HTTP $($response.StatusCode)"
              }

              Write-Host "DEV deployment verification successful."
            '
